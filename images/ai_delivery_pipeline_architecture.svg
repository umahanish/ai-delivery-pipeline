<svg width="100%" viewBox="0 0 720 800" role="img" xmlns="http://www.w3.org/2000/svg">
<title>AI Delivery Pipeline — end-to-end architecture</title>
<desc>A Product Owner submits a backlog item through a web UI. It becomes a JIRA story, then an autonomous coding agent implements it and opens a pull request. CI quality gates run automatically; a human is the only one who can approve the merge. Merging triggers an automatic staging deploy and security scan, and the result is synced back to the UI.</desc>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<style>
  text { font-family: anthropic-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .title { font-size: 14px; font-weight: 500; text-anchor: middle; dominant-baseline: central; }
  .sub   { font-size: 11.5px; font-weight: 400; text-anchor: middle; dominant-baseline: central; }
  .label { font-size: 11px; font-weight: 400; fill: rgb(120,118,113); font-style: italic; }
  .arrow { stroke: rgb(137,135,129); stroke-width: 1.5px; fill: none; }
  .arrow-dashed { stroke: rgb(137,135,129); stroke-width: 1.5px; fill: none; stroke-dasharray: 4 3; }
</style>

<!-- ==== flow ==== -->

<!-- 1. Actor -->
<rect x="190" y="30" width="300" height="44" rx="10" style="fill:rgb(241,239,232);stroke:rgb(95,94,90);stroke-width:0.5px"/>
<text x="340" y="52" class="title" style="fill:rgb(68,68,65)">Product Owner / PM / Scrum Master</text>

<line x1="340" y1="74" x2="340" y2="96" class="arrow" marker-end="url(#arrow)"/>

<!-- 2. Backlog UI -->
<rect x="170" y="96" width="340" height="56" rx="10" style="fill:rgb(230,241,251);stroke:rgb(24,95,165);stroke-width:0.5px"/>
<text x="340" y="114" class="title" style="fill:rgb(12,68,124)">Backlog UI (Next.js)</text>
<text x="340" y="134" class="sub" style="fill:rgb(24,95,165)">title, description, acceptance criteria, target repo</text>

<!-- side: JIRA -->
<line x1="510" y1="124" x2="544" y2="124" class="arrow" marker-end="url(#arrow)"/>
<rect x="546" y="104" width="124" height="44" rx="10" style="fill:rgb(241,239,232);stroke:rgb(95,94,90);stroke-width:0.5px"/>
<text x="608" y="126" class="title" style="fill:rgb(68,68,65)">JIRA story</text>

<line x1="340" y1="152" x2="340" y2="190" class="arrow" marker-end="url(#arrow)"/>
<text x="350" y="175" class="label">PM clicks "Mark ready for dev"</text>

<!-- 3. Orchestrator / coding agent -->
<rect x="140" y="190" width="400" height="76" rx="10" style="fill:rgb(225,245,238);stroke:rgb(15,110,86);stroke-width:0.5px"/>
<text x="340" y="208" class="title" style="fill:rgb(8,80,65)">Orchestrator: coding agent</text>
<text x="340" y="228" class="sub" style="fill:rgb(15,110,86)">Claude Agent SDK — isolated clone → implement → test</text>
<text x="340" y="248" class="sub" style="fill:rgb(15,110,86)">self-review, bounded retries (needs_human if it can't converge)</text>

<line x1="340" y1="266" x2="340" y2="290" class="arrow" marker-end="url(#arrow)"/>

<!-- 4. PR opened -->
<rect x="190" y="290" width="300" height="44" rx="10" style="fill:rgb(225,245,238);stroke:rgb(15,110,86);stroke-width:0.5px"/>
<text x="340" y="312" class="title" style="fill:rgb(8,80,65)">Pull request opened on GitHub</text>

<line x1="340" y1="334" x2="340" y2="364" class="arrow" marker-end="url(#arrow)"/>
<text x="350" y="352" class="label">3 required checks run automatically</text>

<!-- 5. CI gates -->
<rect x="160" y="364" width="360" height="56" rx="10" style="fill:rgb(238,237,254);stroke:rgb(83,74,183);stroke-width:0.5px"/>
<text x="340" y="382" class="title" style="fill:rgb(60,52,137)">CI gates (required status checks)</text>
<text x="340" y="402" class="sub" style="fill:rgb(83,74,183)">tests + SonarCloud + Trivy (Nexus IQ substitute)</text>

<line x1="340" y1="420" x2="340" y2="450" class="arrow" marker-end="url(#arrow)"/>

<!-- 6. Human approval (emphasis) -->
<rect x="200" y="450" width="280" height="56" rx="10" style="fill:rgb(250,236,231);stroke:rgb(153,60,29);stroke-width:1.5px"/>
<text x="340" y="468" class="title" style="fill:rgb(113,43,19)">Human reviews &amp; approves</text>
<text x="340" y="488" class="sub" style="fill:rgb(153,60,29)">the only step nothing here can automate</text>

<line x1="340" y1="506" x2="340" y2="536" class="arrow" marker-end="url(#arrow)"/>
<text x="350" y="524" class="label">merge triggers the deploy workflow</text>

<!-- 7. Deploy + scan -->
<rect x="140" y="536" width="400" height="76" rx="10" style="fill:rgb(225,245,238);stroke:rgb(15,110,86);stroke-width:0.5px"/>
<text x="340" y="554" class="title" style="fill:rgb(8,80,65)">Deploy + scan (on merge to main)</text>
<text x="340" y="574" class="sub" style="fill:rgb(15,110,86)">GitHub Actions → Render staging (real public URL)</text>
<text x="340" y="594" class="sub" style="fill:rgb(15,110,86)">OWASP ZAP baseline scan (Qualys substitute)</text>

<line x1="340" y1="612" x2="340" y2="636" class="arrow" marker-end="url(#arrow)"/>

<!-- 8. Status synced back -->
<rect x="170" y="636" width="340" height="56" rx="10" style="fill:rgb(230,241,251);stroke:rgb(24,95,165);stroke-width:0.5px"/>
<text x="340" y="654" class="title" style="fill:rgb(12,68,124)">Status synced back to the UI</text>
<text x="340" y="674" class="sub" style="fill:rgb(24,95,165)">JIRA · PR · Review · CI · Deploy — per item</text>

<!-- loop back: status -> UI (dashed, routes around the right side) -->
<path d="M510,664 L700,664 L700,20 L380,20 L380,94" class="arrow-dashed" marker-end="url(#arrow)"/>
<text x="495" y="14" class="label" text-anchor="middle">npm run sync-deploy-status (runs locally)</text>

<!-- ==== legend ==== -->
<g>
  <rect x="40" y="724" width="14" height="14" rx="3" style="fill:rgb(241,239,232);stroke:rgb(95,94,90);stroke-width:0.5px"/>
  <text x="60" y="734" class="sub" text-anchor="start" style="fill:rgb(68,68,65)">Human input</text>

  <rect x="220" y="724" width="14" height="14" rx="3" style="fill:rgb(230,241,251);stroke:rgb(24,95,165);stroke-width:0.5px"/>
  <text x="240" y="734" class="sub" text-anchor="start" style="fill:rgb(24,95,165)">UI / status feedback</text>

  <rect x="440" y="724" width="14" height="14" rx="3" style="fill:rgb(225,245,238);stroke:rgb(15,110,86);stroke-width:0.5px"/>
  <text x="460" y="734" class="sub" text-anchor="start" style="fill:rgb(15,110,86)">Automated (agent, deploy)</text>

  <rect x="40" y="754" width="14" height="14" rx="3" style="fill:rgb(238,237,254);stroke:rgb(83,74,183);stroke-width:0.5px"/>
  <text x="60" y="764" class="sub" text-anchor="start" style="fill:rgb(83,74,183)">Quality gates (CI)</text>

  <rect x="220" y="754" width="14" height="14" rx="3" style="fill:rgb(250,236,231);stroke:rgb(153,60,29);stroke-width:1px"/>
  <text x="240" y="764" class="sub" text-anchor="start" style="fill:rgb(153,60,29)">Human decision — never automated</text>
</g>

</svg>
